<!doctype html>
<meta charset="utf-8">
<title>Handoff: a checkout that says no</title>
<!-- After the user's step (their card), Place Order answers with an alert, as Gabe's checkout did (5 Nov 2026): Kite must
     tell Claude, whose handoff_status wait wakes for it. No real site: nothing here is sent anywhere. -->
<style>body{font:14px system-ui;margin:0} input,button{position:absolute;left:40px;width:260px;height:32px;font:inherit}</style>
<h1 style="margin:20px 40px">Checkout</h1>
<input id="card" style="top:80px" placeholder="Card number" autocomplete="off">
<button id="place" style="top:140px">Place Order</button>
<script>
document.getElementById('place').addEventListener('click', () => {
  // As a payment check that comes back a moment later.
  setTimeout(() => alert("Something doesn't look right. Double check your credit card information and try again"), 300);
});
</script>
