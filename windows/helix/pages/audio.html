<!doctype html>
<meta charset="utf-8">
<title>audio: stopped</title>
<!-- W5b's busy check: an <audio> element playing (the Mac's playingMediaScript counts audio
     and video elements, not Web Audio). Click Play; the title says whether it's playing. -->
<button id="play" style="font-size:24px">Play</button>
<audio id="tone" loop></audio>
<script>
// One second of a quiet 440 Hz tone as a WAV, looped.
const rate = 8000, n = rate, data = new DataView(new ArrayBuffer(44 + n * 2));
const text = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
text(0, 'RIFF'); data.setUint32(4, 36 + n * 2, true); text(8, 'WAVEfmt ');
data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 1, true);
data.setUint32(24, rate, true); data.setUint32(28, rate * 2, true); data.setUint16(32, 2, true);
data.setUint16(34, 16, true); text(36, 'data'); data.setUint32(40, n * 2, true);
for (let i = 0; i < n; i++) data.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 3000, true);
const tone = document.getElementById('tone');
tone.src = URL.createObjectURL(new Blob([data], {type: 'audio/wav'}));
tone.onplaying = () => document.title = 'audio: playing';
tone.onpause = () => document.title = 'audio: stopped';
document.getElementById('play').onclick = () => tone.paused ? tone.play() : tone.pause();
</script>
