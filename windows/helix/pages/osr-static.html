<!doctype html>
<!-- W10 spike (docs/windows-osr-spike.md), windows/tools/osrperf: a static page. Nothing moves
     until a mousemove, which changes the grey block's colour, so the tool can time a posted
     input to the first presented frame that shows it (it finds the block by the green marker
     above it, which never changes). Idle, it should present nothing. -->
<meta charset="utf-8">
<title>osr static</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui; background: #fff; color: #222; }
  #marker { position: fixed; left: 40px; top: 20px; width: 120px; height: 10px; background: #00ff00; z-index: 1; }
  #block { position: fixed; left: 40px; top: 40px; width: 120px; height: 120px; background: #808080; }
  main { margin: 200px 40px 40px; max-width: 60em; }
</style>
<div id="marker"></div><div id="block"></div>
<main>
  <h1>Static page</h1>
  <p>Text that never changes. The block above changes colour on each mousemove.</p>
</main>
<script>
  const colours = ['#ff0000', '#0000ff', '#ff00ff', '#ffff00', '#00ffff', '#000000'];
  let n = 0;
  addEventListener('mousemove', () => { document.getElementById('block').style.background = colours[n++ % colours.length]; });
</script>
