name: CI (Windows)

# Builds and tests the Swift KiteCore on Windows, so this runs only when it changes.
# Kite for Windows itself is native C++ (windows/, ci-windows-native.yml) and doesn't use
# KiteCore's code; this job only keeps KiteCore portable.
# A path filter on the trigger (not a separate "changes" job) means no extra job
# hop before the build starts.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/KiteCore/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/ci-restore-mtimes.sh'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'Sources/KiteCore/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/ci-restore-mtimes.sh'
      - '.github/workflows/ci-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keeps the Swift KiteCore building on Windows (Kite for Windows is C++ and
  # doesn't need it); runs only when KiteCore or its tests change.
  windows:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Make the cached build incremental
        run: scripts/ci-restore-mtimes.sh
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Test KiteCore
        shell: pwsh
        run: swift test
      - name: Save build cache (main only, so every PR starts from main's build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > .build/ci-built-sha
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
