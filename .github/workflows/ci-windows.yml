name: CI (Windows)

# Keeps KiteCore portable for the Windows shell. Windows builds only KiteCore and its tests
# (Package.swift), so this runs only when they change.
on:
  push:
    branches: [main]
    paths:
      - Sources/KiteCore/**
      - Tests/KiteCoreTests/**
      - Package.swift
      - .github/workflows/ci-windows.yml
  pull_request:
    paths:
      - Sources/KiteCore/**
      - Tests/KiteCoreTests/**
      - Package.swift
      - .github/workflows/ci-windows.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Test KiteCore
        run: swift test
