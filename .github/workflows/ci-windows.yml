name: CI (Windows)

# KiteCore, its tests and the Windows shell build on Windows, so this runs only when they change.
# A path filter on the trigger (not a separate "changes" job) means no extra job
# hop before the build starts.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/KiteCore/**'
      - 'Sources/KiteWindows/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/ci-restore-mtimes.sh'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'Sources/KiteCore/**'
      - 'Sources/KiteWindows/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/ci-restore-mtimes.sh'
      - '.github/workflows/ci-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keeps KiteCore portable and builds the Windows shell.
  windows:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Make the cached build incremental
        run: scripts/ci-restore-mtimes.sh
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Test KiteCore
        shell: pwsh
        run: swift test
      - name: Build the Windows shell
        shell: pwsh
        run: swift build --product Kite
      - name: Smoke-test the Windows shell
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "kite-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $profile | Out-Null
          $env:KITE_SUPPORT_PATH = $profile
          $bin = swift build --product Kite --show-bin-path
          & "$bin\Kite.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Kite.exe exited with $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $profile 'session.json'))) { throw 'no session.json written' }
          # A KITE_SUPPORT_PATH that isn't a directory must be refused, not fallen back from.
          $env:KITE_SUPPORT_PATH = Join-Path $profile 'session.json'
          & "$bin\Kite.exe" --smoke-test
          if ($LASTEXITCODE -eq 0) { throw 'Kite.exe accepted a file as KITE_SUPPORT_PATH' }
          $global:LASTEXITCODE = 0
      - name: Save build cache (main only, so every PR starts from main's build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > .build/ci-built-sha
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
