name: CI (Windows app)

# Kite for Windows (native C++, windows/). Runs only when it or the fixtures it shares with
# the Mac (Tests/Fixtures) change.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/ci-windows-native.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/ci-windows-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The rules in docs/windows-architecture.md that MSVC can't check: core and its tests
  # build and pass on any OS, and the app builds with MinGW-w64 GCC -Wall -Wextra -Werror.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Core and tests (GCC, Linux)
        run: |
          cmake -S windows -B /tmp/kite-core
          cmake --build /tmp/kite-core -j
          ctest --test-dir /tmp/kite-core --output-on-failure --timeout 120
      - name: Core tests under ASan and UBSan (GCC, Linux)
        # A general guard against undefined behaviour MSVC hides (a dangling view, a read past an
        # end, signed overflow): it fails here instead of flaking. It can't catch a bad entropy
        # source such as Zen 5's RDSEED; newUuidsAreDistinct guards that. The runner's kernel uses
        # 32 bits of mmap randomization (vm.mmap_rnd_bits), which GCC 13's ASan can't map its
        # shadow memory around, so it's narrowed first; the sysctl can go once the runner's GCC
        # is 14 or newer.
        run: |
          sudo sysctl -q vm.mmap_rnd_bits=28
          cmake -S windows -B /tmp/kite-asan -DCMAKE_BUILD_TYPE=Debug -DKITE_WERROR=OFF \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/kite-asan --target KiteCoreTests -j
          ctest --test-dir /tmp/kite-asan -R KiteCoreTests --output-on-failure --timeout 120
      - name: Golden backdrop fixture is current
        # The CPU reference must write exactly the file the Mac's Kite.metal is tested against;
        # after a deliberate shader change, regenerate it with this target.
        run: |
          cmake --build /tmp/kite-core --target gen-theme-golden
          /tmp/kite-core/gen-theme-golden | diff -u Tests/Fixtures/theme-backdrop.json -
      - name: Cross-compile Kite.exe (MinGW-w64)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64 > /dev/null
          cmake -S windows -B /tmp/kite-mingw -DCMAKE_TOOLCHAIN_FILE="$PWD/windows/cmake/mingw-w64.cmake"
          cmake --build /tmp/kite-mingw -j

  windows-app:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 35  # a cold CEF cache downloads and builds its wrapper
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # Chromium (CEF): the pinned build from windows/scripts/fetch-cef.ps1. The unpacked
      # distribution is cached between runs; its C++ wrapper is built every run, by this
      # runner's MSVC, so a cache made by another toolset can't reach this linker.
      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: |
            windows/ThirdParty/cef
            !windows/ThirdParty/cef/build-*
          # The pinned $CefVersion and $CefSha1 in fetch-cef.ps1; change with them.
          key: cef-windows64-156.0.7+g47dbc1d-e13cb97c5be44784c2dba6df960791ea5cf6d406
      - name: Fetch CEF and build its wrapper
        timeout-minutes: 15
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          & windows/scripts/fetch-cef.ps1 -Configs Release
      - name: Configure (MSVC)
        run: cmake -S windows -B windows/build -A x64  # newest Visual Studio found
      - name: Build
        run: cmake --build windows/build --config Release --parallel
      - name: Unit tests
        timeout-minutes: 5
        run: ctest --test-dir windows/build -C Release --output-on-failure --timeout 120
      - name: Launch checks
        timeout-minutes: 8  # covers kitecore.exe, which has no per-call timeout
        run: |
          # Runs Kite.exe and returns its exit code, killing it after a minute so a run that
          # never quits fails the step instead of hanging the job.
          # Kite.exe writes why it failed to stderr, and what the smoke test found of the first
          # page's renderer sandbox (W6b) to stdout, both shown here.
          function Run-Kite([string[]] $arguments) {
            $stdoutFile = Join-Path $env:RUNNER_TEMP "kite-stdout-$([guid]::NewGuid()).txt"
            $stderrFile = Join-Path $env:RUNNER_TEMP "kite-stderr-$([guid]::NewGuid()).txt"
            $process = Start-Process -FilePath (Resolve-Path windows/build/Release/Kite.exe) -ArgumentList $arguments `
              -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile -PassThru
            $null = $process.Handle  # keep the handle, or ExitCode reads empty after WaitForExit(timeout)
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              throw "Kite.exe $arguments didn't exit within 60 s"
            }
            foreach ($file in $stdoutFile, $stderrFile) {
              if ((Test-Path $file) -and (Get-Item $file).Length -gt 0) { Write-Host (Get-Content $file -Raw) }
            }
            return $process.ExitCode
          }
          $profileDir = Join-Path $env:RUNNER_TEMP "kite-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $profileDir | Out-Null
          $env:KITE_SUPPORT_PATH = $profileDir
          # The selected tab is a page from the repo, so the smoke test needs no network.
          $smokePage = ([uri](Resolve-Path windows/helix/pages/smoke.html).Path).AbsoluteUri
          & windows/build/Release/kitecore.exe --profile $profileDir open $smokePage | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "kitecore open exited with $LASTEXITCODE" }
          # Chromium's Energy Saver as an earlier run could have left it, off: the smoke test
          # fails unless Kite turns it on (1, Chromium's own default, so a fresh profile can't
          # tell).
          New-Item -ItemType Directory -Path (Join-Path $profileDir 'Chromium') | Out-Null
          [IO.File]::WriteAllText((Join-Path $profileDir 'Chromium\Local State'),
            '{"performance_tuning":{"battery_saver_mode":{"state":0}}}')

          # It also fails unless the first page's renderer is in Chromium's sandbox and no helper
          # but the network service runs at medium integrity (W6b); it prints each one's sandbox.
          $code = Run-Kite @('--smoke-test')
          if ($code -ne 0) { throw "--smoke-test exited with $code" }
          if (-not (Test-Path (Join-Path $profileDir 'session.json'))) { throw 'Kite.exe wrote no session.json' }
          # With Chromium the smoke test loaded the selected tab's page in the default profile,
          # where the Mac keeps it.
          if (-not (Test-Path (Join-Path $profileDir 'Chromium\Default'))) { throw 'Chromium made no profile in Chromium\Default' }
          # ...and saved what the page reported into the session.
          $tab = (& windows/build/Release/kitecore.exe --profile $profileDir state | ConvertFrom-Json).selectedTab
          if ($LASTEXITCODE -ne 0) { throw "kitecore state exited with $LASTEXITCODE" }
          Write-Host "selected tab after the smoke test: $($tab.title) <$($tab.url)>"
          # The page titles itself with its visibility as it loads: it must have come up visible.
          if ($tab.title -ne 'Kite smoke page visible') { throw "the session has no title from a visible page: '$($tab.title)'" }
          # The headless model reads what the app wrote.
          & windows/build/Release/kitecore.exe --profile $profileDir state
          if ($LASTEXITCODE -ne 0) { throw "kitecore state exited with $LASTEXITCODE" }

          # A flag without its value is a usage error (exit 1), never a normal launch.
          $code = Run-Kite @('--capture')
          if ($code -ne 1) { throw "--capture without a path: expected exit 1, got $code" }
          # Kite's command line is never Chromium's: a switch with Windows' "/" prefix is an
          # unknown option, and an option's value can't be another flag.
          $code = Run-Kite @('--smoke-test', '/remote-debugging-port=9222')
          if ($code -ne 1) { throw "/remote-debugging-port: expected exit 1, got $code" }
          $code = Run-Kite @('--capture', '--smoke-test')
          if ($code -ne 1) { throw "--capture with a flag as its value: expected exit 1, got $code" }
          # Kite.exe runs from its own folder (CEF's bootstrap), so paths must be absolute.
          $code = Run-Kite @('--capture', 'relative.png')
          if ($code -ne 1) { throw "--capture with a relative path: expected exit 1, got $code" }
          $code = Run-Kite @('--smoke-test', '--frame-log', 'relative.jsonl')
          if ($code -ne 1) { throw "--frame-log with a relative path: expected exit 1, got $code" }

          # A KITE_SUPPORT_PATH that isn't a directory is refused (exit 2), never fallen back from.
          $file = Join-Path $profileDir 'not-a-dir'
          Set-Content -Path $file -Value x
          $env:KITE_SUPPORT_PATH = $file
          $code = Run-Kite @('--smoke-test')
          if ($code -ne 2) { throw "a file as KITE_SUPPORT_PATH: expected exit 2, got $code" }
          $env:KITE_SUPPORT_PATH = 'relative\profile'
          $code = Run-Kite @('--smoke-test')
          if ($code -ne 2) { throw "a relative KITE_SUPPORT_PATH: expected exit 2, got $code" }

          # Test flags never run on the real profile.
          Remove-Item Env:KITE_SUPPORT_PATH
          $code = Run-Kite @('--smoke-test')
          if ($code -ne 1) { throw "--smoke-test without KITE_SUPPORT_PATH: expected exit 1, got $code" }
          $global:LASTEXITCODE = 0
      - name: kiteperf smoke (the measurement harness builds and runs)
        timeout-minutes: 5
        run: |
          # windows/tools/perf, briefly: launch, two tabs, a 5 s idle that must present and commit
          # nothing (exit 4 if it does), a few space switches and a hover, then WM_CLOSE. WARP has
          # no PDH GPU counters, so the GPU fields are null.
          $out = Join-Path $env:RUNNER_TEMP 'kiteperf-smoke.json'
          & windows/build/tools/Release/kiteperf.exe --kite (Resolve-Path windows/build/Release/Kite.exe) --scenario smoke --runs 1 --out $out
          if ($LASTEXITCODE -ne 0) { throw "kiteperf --scenario smoke exited with $LASTEXITCODE" }
      - name: Backdrop matches the Mac's shader (GPU vs CPU reference)
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'backdrop-test.txt'
          $err = Join-Path $env:RUNNER_TEMP 'backdrop-test-stderr.txt'
          $process = Start-Process -FilePath (Resolve-Path windows/build/Release/Kite.exe) -ArgumentList '--backdrop-test' `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(240000)) { $process.Kill(); throw 'Kite.exe --backdrop-test hung' }
          if (Test-Path $out) { Get-Content $out -Raw | Write-Host }
          if ($process.ExitCode -ne 0) { throw "--backdrop-test exited with $($process.ExitCode): $(Get-Content $err -Raw)" }
      - name: Capture (Helix UI gate plumbing)
        timeout-minutes: 3
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP "kite-capture-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $profileDir | Out-Null
          Copy-Item windows/helix/states/two-spaces.json (Join-Path $profileDir 'session.json')
          $env:KITE_SUPPORT_PATH = $profileDir
          # Captures at 1x and 2x (the window laid out at that scale, so 2x works on the runner's
          # 100% display). Each sampled pixel must match core's CPU reference of the Mac's shader
          # (kitecore theme: the same theme, stored at 8 bits like the swap chain, over the same solid
          # material) within one level: that catches the wrong material, tint, grain, size or space.
          Add-Type -AssemblyName System.Drawing
          $kitecore = Resolve-Path windows/build/Release/kitecore.exe
          $state = & $kitecore state
          if ($LASTEXITCODE -ne 0) { throw "kitecore state exited with $LASTEXITCODE" }
          $space = ($state | ConvertFrom-Json).selectedSpaceID
          foreach ($scale in 1, 2) {
            $png = Join-Path $env:RUNNER_TEMP "kite-capture-${scale}x.png"
            $stderrFile = Join-Path $env:RUNNER_TEMP "kite-capture-${scale}x-stderr.txt"
            $process = Start-Process -FilePath (Resolve-Path windows/build/Release/Kite.exe) `
              -ArgumentList '--capture', $png, '--window-size', '1280,820', '--capture-scale', $scale `
              -RedirectStandardError $stderrFile -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Kite.exe --capture ($scale x) hung" }
            if ($process.ExitCode -ne 0) { throw "Kite.exe --capture ($scale x) exited with $($process.ExitCode): $(Get-Content $stderrFile -Raw)" }
            $w = 1280 * $scale; $h = 820 * $scale
            $reference = (& $kitecore theme $space $w $h | ConvertFrom-Json).backdrop
            if ($LASTEXITCODE -ne 0) { throw "kitecore theme exited with $LASTEXITCODE" }
            $bitmap = [System.Drawing.Bitmap]::new($png)
            try {
              Write-Host "capture ${scale}x: $($bitmap.Width)x$($bitmap.Height) px, material $($reference.material)"
              if ($bitmap.Width -ne $w -or $bitmap.Height -ne $h) { throw "capture is $($bitmap.Width)x$($bitmap.Height), expected ${w}x${h}" }
              # Parenthesised: PowerShell's comma binds tighter than minus.
              $points = [ordered]@{ topLeft = @(0, 0); topRight = @(($w - 1), 0); bottomLeft = @(0, ($h - 1));
                                    bottomRight = @(($w - 1), ($h - 1)); centre = @(($w / 2), ($h / 2)) }
              foreach ($name in $points.Keys) {
                $point = $points[$name]
                $pixel = $bitmap.GetPixel($point[0], $point[1])
                $expected = [Convert]::ToInt32($reference.$name.Substring(1), 16)
                $er = ($expected -shr 16) -band 255; $eg = ($expected -shr 8) -band 255; $eb = $expected -band 255
                Write-Host "  $name $($point -join ','): #$($pixel.Name), reference $($reference.$name)"
                if ($pixel.A -ne 255) { throw "capture pixel $name isn't opaque" }
                if ([Math]::Abs($pixel.R - $er) -gt 1 -or [Math]::Abs($pixel.G - $eg) -gt 1 -or [Math]::Abs($pixel.B - $eb) -gt 1) {
                  throw "capture pixel $name is #$($pixel.Name), the reference is $($reference.$name)"
                }
              }
            } finally { $bitmap.Dispose() }
          }
      - name: Upload Kite
        # The Release build with Chromium's runtime beside it, for trying it on a Windows
        # machine without Visual Studio: unzip and run Kite.exe.
        uses: actions/upload-artifact@v4
        with:
          name: kite-windows-x64
          retention-days: 7  # over 400 MB with Chromium's runtime
          path: |
            windows/build/Release/
            !windows/build/Release/**/*.lib
            !windows/build/Release/**/*.pdb
            !windows/build/Release/**/*.exp
            !windows/build/Release/KiteCoreTests.exe
            !windows/build/Release/kiteperf.exe
          if-no-files-found: error
      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-windows-capture
          path: ${{ runner.temp }}/kite-capture-*.png
          if-no-files-found: ignore
      - name: Upload the kiteperf smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiteperf-smoke
          path: ${{ runner.temp }}/kiteperf-smoke.json
          if-no-files-found: ignore
