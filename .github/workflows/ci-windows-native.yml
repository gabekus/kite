name: CI (Windows app)

# Kite for Windows (native C++, windows/). Runs only when it changes.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/ci-windows-native.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - '.github/workflows/ci-windows-native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-app:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: cmake -S windows -B windows/build -A x64  # newest Visual Studio found
      - name: Build
        run: cmake --build windows/build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir windows/build -C Release --output-on-failure
      - name: Smoke-test Kite.exe
        run: |
          $exe = Resolve-Path windows/build/Release/Kite.exe
          $profileDir = Join-Path $env:RUNNER_TEMP "kite-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $profileDir | Out-Null
          $env:KITE_SUPPORT_PATH = $profileDir
          $run = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Kite.exe exited with $($run.ExitCode)" }
          $session = Join-Path $profileDir 'session.json'
          if (-not (Test-Path $session)) { throw 'Kite.exe wrote no session.json' }
          # The headless core reads what the app wrote (and the Mac's format).
          & windows/build/Release/kitecore.exe --profile $profileDir state
          if ($LASTEXITCODE -ne 0) { throw "kitecore state exited with $LASTEXITCODE" }
          # A KITE_SUPPORT_PATH that isn't a directory must be refused (exit 2), never fallen back from.
          $file = Join-Path $profileDir 'not-a-dir'
          Set-Content -Path $file -Value x
          $env:KITE_SUPPORT_PATH = $file
          $run = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($run.ExitCode -ne 2) { throw "expected exit 2 for a file KITE_SUPPORT_PATH, got $($run.ExitCode)" }
          Write-Host "smoke test ok ($((Get-Item $exe).Length) bytes)"
      - name: Capture (Helix UI gate plumbing)
        run: |
          $exe = Resolve-Path windows/build/Release/Kite.exe
          $profileDir = Join-Path $env:RUNNER_TEMP "kite-capture-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $profileDir | Out-Null
          Copy-Item windows/helix/states/two-spaces.json (Join-Path $profileDir 'session.json')
          $env:KITE_SUPPORT_PATH = $profileDir
          $png = Join-Path $env:RUNNER_TEMP 'kite-capture.png'
          $run = Start-Process -FilePath $exe -ArgumentList '--capture', $png, '--window-size', '1280,800' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Kite.exe --capture exited with $($run.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes($png)
          $width = [System.BitConverter]::ToUInt32(@($bytes[19], $bytes[18], $bytes[17], $bytes[16]), 0)
          $height = [System.BitConverter]::ToUInt32(@($bytes[23], $bytes[22], $bytes[21], $bytes[20]), 0)
          Write-Host "capture: ${width}x${height} px"
          if ($width -lt 1280 -or $height -lt 800) { throw "capture is ${width}x${height}, expected at least 1280x800" }
