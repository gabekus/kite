name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# A new push to a PR cancels the run it replaces, so stale runs stop holding one
# of the few macOS runners the account gets. On main a running build finishes
# (it saves the cache PRs restore), and only the queued runs in between are
# replaced by the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    # Set the MACOS_RUNNER repo variable to move this job to another runner
    # (a paid service or a self-hosted Mac) without editing the workflow.
    # Pull requests from forks always use GitHub's runner, never a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-15' || vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless: full history (needed to diff against the cached build's
          # commit) without downloading old file contents.
          fetch-depth: 0
          filter: blob:none
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Make the cached build incremental
        run: scripts/ci-restore-mtimes.sh
      - name: Test (WebKit build, no CEF download)
        run: swift test
      - name: Save build cache (main only, so every PR starts from main's build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > .build/ci-built-sha
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
